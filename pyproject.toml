[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-optimizer"
version = "0.1.0"
description = "Task-aware relevance scoring and pruning advisor for long Claude Code sessions"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "rich>=13.0",
]

[project.optional-dependencies]
tokenizer = ["tiktoken>=0.7"]
semantic = ["fastembed>=0.3"]
dev = ["pytest>=8.0"]

[project.scripts]
context-optimizer = "context_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
